<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Vakya Sangham</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-hover: #45a049;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333;
            --muted-color: #666;
            --border-radius: 12px;
            --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            text-align: center;
        }

        h2 {
            margin-bottom: 24px;
            color: var(--text-color);
            font-size: 24px;
        }

        p.description {
            margin-bottom: 30px;
            color: var(--muted-color);
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted-color);
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .success {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .error {
            background-color: #ffebee;
            color: #c62828;
        }

        .footer-link {
            display: block;
            margin-top: 20px;
            color: var(--muted-color);
            text-decoration: none;
            font-size: 14px;
        }

        .footer-link:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <h2>Forgot Password?</h2>
            <p class="description">Enter your email address and we'll send you a link to reset your password.</p>

            <form id="forgotForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>
                <button type="submit" id="submitBtn">Send Reset Link</button>
            </form>
            <div id="message" class="message"></div>

            <!-- Optional: Link back to app if deep linking existed, or just text -->
            <a href="#" class="footer-link">Back to Login</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('forgotForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;

            if (!email) {
                showMessage("Please enter your email address.", 'error');
                return;
            }

            setLoading(true);

            try {
                // Call the existing API
                const response = await fetch('/user/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage("Reset link sent! Please check your email inbox.", 'success');
                    form.reset();
                } else {
                    showMessage(data.message || "Failed to send reset link.", 'error');
                }

            } catch (error) {
                console.error("Error:", error);
                showMessage("Network error. Please try again.", 'error');
            } finally {
                setLoading(false);
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                submitBtn.textContent = "Sending...";
            } else {
                submitBtn.disabled = false;
                submitBtn.textContent = "Send Reset Link";
            }
        }
    </script>

</body>

</html>
